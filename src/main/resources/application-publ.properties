# H2 Database Configuration (for development/testing)
#spring.application.name=TicketManagementSystem-Backend
#spring.datasource.url=jdbc:h2:mem:demo_db
#spring.h2.console.enabled=true

# MySQL Configuration
spring.datasource.url=jdbc:mysql://mysql:3306/ticketsSystem?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
#spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:secretkey}
jwt.expire-access-token=3600000
jwt.expire-refresh-token=86400000
jwt.auth-header=Authorization
# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.email.from=${EMAIL_FROM}
app.email.enabled=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# CORS Configuration
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000